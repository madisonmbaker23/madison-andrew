<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Madison &amp; Andrew Invitation</title>
<meta name="description" content="You are invited to celebrate the engagement of Madison Baker and Andrew Colalillo. Sunday, January 10, 2027.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Cormorant+Garamond:ital,wght@0,400..700;1,400..600&family=Pinyon+Script&display=swap">
<style>
/* Layout concept: one espresso envelope centered on ivory. The wax seal opens the flap, the card
   rises out, then moves forward to fill the screen while the envelope fades and a button appears. */
:root {
  --ivory: #F5EFE6;
  --paper: #FBF8F2;
  --beige: #D8C7B2;
  --rose: #C89AA1;
  --olive: #7A8466;
  --espresso: #38251F;
  --gold: #A8864B;
  --muted: #6B5A50;
  --script: 'Pinyon Script', 'Snell Roundhand', 'Apple Chancery', cursive;
  --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', 'Times New Roman', serif;
  --text: 'Cormorant Garamond', Garamond, Georgia, serif;
  --E: min(88vw, 420px, calc((100svh - 150px) / 1.2));
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--ivory);
  background-image: radial-gradient(120% 90% at 50% 38%, #FBF7EE 0%, var(--ivory) 55%, #ECE2D2 100%);
  color: var(--espresso);
  font: 500 1.25rem/1.6 var(--text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
[hidden] { display: none !important; }
img { display: block; max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.page {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding-block: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Stage: the envelope's footprint */
.stage { position: relative; width: var(--E); height: calc(var(--E) * .6667); perspective: 1400px; }
.stage:not(.open) { cursor: pointer; }
.part { position: absolute; transition: opacity .8s ease .15s, transform .9s cubic-bezier(.45, 0, .2, 1) .1s; }
.back { inset: 0; z-index: 0; }
.pocket { inset: 0; z-index: 3; }
.part svg { display: block; width: 100%; height: 100%; }
.back svg, .pocket svg { filter: drop-shadow(0 14px 18px rgba(40, 24, 18, .28)); }
.pocket svg { filter: none; }

/* Flap: hinged along the top edge */
.flap {
  left: 0; top: 0; width: 100%; height: 55%;
  transform-origin: 50% 0;
  transform-style: preserve-3d;
  z-index: 5;
  transition: transform .8s cubic-bezier(.5, 0, .2, 1), z-index 0s .4s, opacity .8s ease .15s;
}
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face.rev { transform: rotateX(180deg); }
.face svg { filter: drop-shadow(0 6px 8px rgba(40, 24, 18, .25)); }

/* Wax seal */
.seal {
  position: absolute; left: 50%; top: 100%;
  width: calc(var(--E) * .17); aspect-ratio: 1;
  transform: translate(-50%, -50%) translateZ(2px);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 0; padding: 0; cursor: pointer;
  border-radius: 52% 48% 50% 50% / 49% 52% 48% 51%;
  background: radial-gradient(circle at 35% 30%, #F8F0E3 0%, #E6D8BF 55%, #CDB994 100%);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .4), inset 0 1px 1px rgba(255, 255, 255, .7), inset 0 -3px 5px rgba(120, 90, 40, .25);
  transition: opacity .25s ease;
}
.seal::before {
  content: ""; position: absolute; inset: 14%;
  -webkit-mask: url(img/monogram.png) center / contain no-repeat;
  mask: url(img/monogram.png) center / contain no-repeat;
  background: linear-gradient(135deg, #B8944F, #8A6B35);
  filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .55));
}
.seal::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  border: 1px solid rgba(245, 239, 230, .75);
  animation: ring 2.6s ease-out infinite;
}
.seal:focus-visible { outline: 2px solid var(--rose); outline-offset: 6px; }
@keyframes ring { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.7); opacity: 0; } }
.open .seal { opacity: 0; pointer-events: none; }
.open .seal::after { animation: none; }

.hint {
  position: absolute; left: 0; right: 0; top: calc(100% + 30px); text-align: center;
  font: 500 .72rem/1.6 var(--display); letter-spacing: .32em; text-transform: uppercase; color: var(--muted);
  transition: opacity .4s ease;
}
.open .hint { opacity: 0; }

/* Card */
.card {
  position: absolute; left: 50%; top: 50%;
  width: calc(var(--E) * .9); aspect-ratio: 4 / 5;
  z-index: 2; container-type: inline-size;
  transform: translate(-50%, -50%) translateY(calc(var(--E) * .02)) scale(.53);
  transition: transform .9s cubic-bezier(.45, 0, .2, 1);
}
.paper {
  position: relative; height: 100%;
  background: var(--paper);
  box-shadow: 0 1px 0 #fff inset, 0 20px 40px -14px rgba(40, 24, 18, .5), 0 2px 6px rgba(40, 24, 18, .22);
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 7cqw 8cqw;
}
.paper::before { content: ""; position: absolute; inset: 3cqw; border: 1px solid var(--beige); pointer-events: none; }
.c-mono { width: 13cqw; height: auto; margin-bottom: 3cqw; }
.c-small { font: 500 2.5cqw/1.7 var(--display); letter-spacing: .24em; text-transform: uppercase; margin: 0; }
.c-names { margin: 2.5cqw 0 2.5cqw; font: 400 13.5cqw/1 var(--script); display: flex; flex-direction: column; align-items: center; }
.c-names i { font-style: normal; font-size: 8cqw; line-height: 1.1; }
.c-invite { margin-bottom: 4cqw; }
.c-date { font: 500 2.7cqw/1.85 var(--display); letter-spacing: .16em; text-transform: uppercase; margin: 0 0 3.5cqw; }
.c-venue { font: 500 4cqw/1.3 var(--display); letter-spacing: .2em; text-transform: uppercase; margin: 0; }
.c-food { font: italic 500 3.8cqw/1.4 var(--text); margin: 1.4cqw 0 0; color: var(--muted); }
.c-reply { font: italic 500 3.6cqw/1.4 var(--text); margin: auto 0 0; color: var(--muted); }

/* Opening sequence: .open, then .up, then .out, then .done */
.open .flap { transform: rotateX(180deg); z-index: 1; }
.up .card { transform: translate(-50%, -50%) translateY(calc(var(--E) * -.52)) scale(.53); }
.out .card { transform: translate(-50%, -50%) translateY(calc(var(--E) * -.06)) scale(1); z-index: 6; transition-duration: 1s; }
.out .back, .out .pocket { opacity: 0; transform: translateY(calc(var(--E) * .35)); }
.out .flap { opacity: 0; }

.go {
  position: absolute; left: 50%; top: calc(100% + var(--E) * .1685 + 22px);
  transform: translateX(-50%);
  width: min(290px, 82vw); text-align: center;
  font: 500 .76rem/1 var(--display); letter-spacing: .28em; text-transform: uppercase; text-decoration: none;
  padding: 19px 24px; border: 1px solid var(--espresso); background: var(--espresso); color: var(--ivory);
  opacity: 0; pointer-events: none; transition: opacity .7s ease, background .25s, color .25s; z-index: 7;
}
.done .go { opacity: 1; pointer-events: auto; }
.done .go:hover { background: transparent; color: var(--espresso); }
.go:focus-visible { outline: 2px solid var(--rose); outline-offset: 4px; }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01s !important; transition-delay: 0s !important; animation: none !important; }
}
</style>
</head>
<body>

        <ellipse cx="0" cy="-4.2" rx="2.6" ry="3.6" fill="#F3ECE0" opacity=".9" transform="rotate(72)"/>

        <ellipse cx="0" cy="-4.2" rx="2.6" ry="3.6" fill="#F3ECE0" opacity=".9" transform="rotate(288)"/>

      </g>
      <g transform="translate(33 33)">
        <ellipse cx="0" cy="-4.2" rx="2.6" ry="3.6" fill="#D7AEB2" opacity=".95"/>
        <ellipse cx="0" cy="-4.2" rx="2.6" ry="3.6" fill="#D7AEB2" opacity=".95" transform="rotate(72)"/>
        <ellipse cx="0" cy="-4.2" rx="2.6" ry="3.6" fill="#D7AEB2" opacity=".95" transform="rotate(144)"/>
        <ellipse cx="0" cy="-4.2" rx="2.6" ry="3.6" fill="#D7AEB2" opacity=".95" transform="rotate(216)"/>

    <linearGradient id="gL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3C2A24"/><stop offset="1" stop-color="#46322B"/></linearGradient>
    <linearGradient id="gR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#3C2A24"/><stop offset="1" stop-color="#46322B"/></linearGradient>
    <linearGradient id="gB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#33221D"/><stop offset="1" stop-color="#4C372F"/></linearGradient>
    <linearGradient id="gF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D2B25"/><stop offset="1" stop-color="#4A362E"/></linearGradient>
  </defs>
</svg>

<main class="page">
  <div class="stage" id="stage">
    <div class="part back" aria-hidden="true">
      <svg viewBox="0 0 300 200" preserveAspectRatio="none"><rect width="300" height="200" fill="url(#liner)"/><rect width="300" height="200" fill="#2A1A15" opacity=".42"/></svg>
    </div>

    <article class="card" aria-label="Invitation to Madison and Andrew's engagement party">
      <div class="paper">
        <img class="c-mono" src="img/monogram.png" alt="">
        <p class="c-small">Together with their families</p>
        <h1 class="c-names"><span>Madison</span><i>&amp;</i><span>Andrew</span></h1>
        <p class="c-small c-invite">invite you to celebrate their engagement</p>
        <p class="c-date">Sunday, the tenth of January<br>two thousand twenty-seven<br>from two until five in the afternoon</p>

        <p class="c-food">Food and drinks provided</p>
        <p class="c-reply">Kindly reply by January 1, 2027</p>
      </div>
    </article>

    <div class="part pocket" aria-hidden="true">
      <svg viewBox="0 0 300 200" preserveAspectRatio="none">
        <polygon points="0,0 0,200 150,110" fill="url(#gL)"/>
        <polygon points="300,0 300,200 150,110" fill="url(#gR)"/>
        <polygon points="0,200 300,200 150,110" fill="url(#gB)"/>
        <path d="M0 0 L150 110 L300 0" fill="none" stroke="#F5EFE6" stroke-opacity=".10" stroke-width=".8"/>
        <path d="M0 200 L150 110 L300 200" fill="none" stroke="#F5EFE6" stroke-opacity=".08" stroke-width=".8"/>
        <rect x=".4" y=".4" width="299.2" height="199.2" fill="none" stroke="#F5EFE6" stroke-opacity=".08" stroke-width=".8"/>
      </svg>
    </div>

    <div class="part flap">
      <div class="face front" aria-hidden="true">
        <svg viewBox="0 0 300 110" preserveAspectRatio="none">
          <polygon points="0,0 300,0 150,110" fill="url(#gF)"/>
          <path d="M0 0 L150 110 L300 0" fill="none" stroke="#F5EFE6" stroke-opacity=".14" stroke-width=".9"/>
        </svg>
      </div>
      <div class="face rev" aria-hidden="true">
        <svg viewBox="0 0 300 110" preserveAspectRatio="none">
          <polygon points="0,0 300,0 150,110" fill="url(#liner)"/>
          <polygon points="0,0 300,0 150,110" fill="#2A1A15" opacity=".12"/>
          <path d="M0 0 L150 110 L300 0" fill="none" stroke="#38251F" stroke-opacity=".35" stroke-width=".9"/>
        </svg>
      </div>
      <button class="seal" id="seal" type="button" aria-label="Open the invitation"></button>
    </div>

    <p class="hint" id="hint">Tap the seal to open</p>
    <a class="go" id="go" href="https://madisonmbaker23.github.io/madison-andrew/">RSVP &amp; Details</a>
  </div>
  <p class="sr" id="live" aria-live="polite"></p>
</main>

<noscript><p style="text-align:center"><a href="https://madisonmbaker23.github.io/madison-andrew/">Madison &amp; Andrew's engagement party: details and RSVP</a></p></noscript>

<script>
(function () {
  var stage = document.getElementById('stage');
  var live = document.getElementById('live');
  var started = false;
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function step(cls, ms) { setTimeout(function () { stage.classList.add(cls); }, still ? 0 : ms); }
  function open() {
    if (started) return;
    started = true;
    stage.classList.add('open');
    step('up', 700);
    step('out', 1700);
    step('done', 2700);
    setTimeout(function () { live.textContent = 'Invitation opened. The RSVP and details link is below the card.'; }, still ? 0 : 2800);
  }
  document.getElementById('seal').addEventListener('click', function (e) { e.stopPropagation(); open(); });
  stage.addEventListener('click', open);
})();
</script>
