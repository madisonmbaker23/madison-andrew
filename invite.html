<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Madison &amp; Andrew Invitation</title>
<meta name="description" content="You are invited to celebrate the engagement of Madison Baker and Andrew Colalillo. Sunday, January 10, 2027.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Cormorant+Garamond:ital,wght@0,400..700;1,400..600&family=Pinyon+Script&display=swap">
<style>
/* Blush envelope with a lace-trimmed flap. The seal opens it, the layered card rises out,
   comes forward, and the flowers bloom over the arched photo before the button appears. */
:root {
  --ivory: #F5EFE6;
  --paper: #FBF8F2;
  --beige: #D8C7B2;
  --rose: #C89AA1;
  --olive: #7A8466;
  --espresso: #38251F;
  --gold: #A8864B;
  --muted: #6B5A50;
  --script: 'Pinyon Script', 'Snell Roundhand', 'Apple Chancery', cursive;
  --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', 'Times New Roman', serif;
  --text: 'Cormorant Garamond', Garamond, Georgia, serif;
  --E: min(88vw, 420px, calc((100svh - 170px) / 1.5));
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--ivory);
  background-image: radial-gradient(120% 90% at 50% 38%, #FBF7EE 0%, var(--ivory) 55%, #ECE2D2 100%);
  color: var(--espresso);
  font: 500 1.25rem/1.6 var(--text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img { display: block; max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.page {
  min-height: 100svh; display: grid; place-items: center; padding-block: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.stage { position: relative; width: var(--E); height: calc(var(--E) * .6667); perspective: 1400px; }
.stage:not(.open) { cursor: pointer; }
.part { position: absolute; transition: opacity .8s ease .15s, transform .9s cubic-bezier(.45, 0, .2, 1) .1s; }
.back { inset: 0; z-index: 0; }
.pocket { inset: 0; z-index: 3; }
.part svg { display: block; width: 100%; height: 100%; overflow: visible; }
.back svg { filter: drop-shadow(0 14px 18px rgba(90, 50, 45, .28)); }

.flap {
  left: 0; top: 0; width: 100%; height: 55%;
  transform-origin: 50% 0; transform-style: preserve-3d; z-index: 5;
  transition: transform .8s cubic-bezier(.5, 0, .2, 1), z-index 0s .4s, opacity .8s ease .15s;
}
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face.rev { transform: rotateX(180deg); }
.face svg { filter: drop-shadow(0 5px 6px rgba(90, 50, 45, .22)); }

.seal {
  position: absolute; left: 50%; top: 100%; width: calc(var(--E) * .17); aspect-ratio: 1;
  transform: translate(-50%, -50%) translateZ(2px);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 0; padding: 0; cursor: pointer;
  border-radius: 52% 48% 50% 50% / 49% 52% 48% 51%;
  background: radial-gradient(circle at 35% 30%, #A3AF8C 0%, #7F8C69 55%, #65714F 100%);
  box-shadow: 0 3px 8px rgba(40, 30, 20, .4), inset 0 1px 1px rgba(255, 255, 255, .4), inset 0 -3px 5px rgba(40, 50, 30, .35);
  transition: opacity .25s ease;
}
.seal::before {
  content: ""; position: absolute; inset: 14%;
  -webkit-mask: url(img/monogram.png) center / contain no-repeat; mask: url(img/monogram.png) center / contain no-repeat;
  background: #F6EEDD; filter: drop-shadow(0 -1px 0 rgba(30, 40, 20, .45));
}
.seal::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  border: 1px solid rgba(122, 132, 102, .8); animation: ring 2.6s ease-out infinite;
}
.seal:focus-visible { outline: 2px solid var(--rose); outline-offset: 6px; }
@keyframes ring { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.7); opacity: 0; } }
.open .seal { opacity: 0; pointer-events: none; }
.open .seal::after { animation: none; }

.hint {
  position: absolute; left: 0; right: 0; top: calc(100% + 30px); text-align: center;
  font: 500 .72rem/1.6 var(--display); letter-spacing: .32em; text-transform: uppercase; color: var(--muted);
  transition: opacity .4s ease;
}
.open .hint { opacity: 0; }

/* Card: sheets stacked behind a paper with an arched photo, florals bloom over it */
.card {
  position: absolute; left: 50%; top: 50%; width: calc(var(--E) * .9); aspect-ratio: 5 / 7;
  z-index: 2; container-type: inline-size;
  transform: translate(-50%, -50%) translateY(calc(var(--E) * .005)) scale(.48);
  transition: transform .9s cubic-bezier(.45, 0, .2, 1);
}
.sheet { position: absolute; inset: 0; box-shadow: 0 6px 14px -6px rgba(60, 35, 30, .35); }
.sheet.s1 { background: #A9B08F; transform: rotate(-3.2deg) translate(-1.5cqw, .8cqw); }
.sheet.s2 { background: #E8C8C4; transform: rotate(2.6deg) translate(1.5cqw, .4cqw); }
.paper {
  position: relative; height: 100%; background: var(--paper);
  box-shadow: 0 1px 0 #fff inset, 0 20px 40px -14px rgba(40, 24, 18, .5), 0 2px 6px rgba(40, 24, 18, .2);
  display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8cqw 8cqw 7cqw;
}
.paper::before { content: ""; position: absolute; inset: 3cqw; border: 1px solid var(--beige); pointer-events: none; }
.archwrap { position: relative; width: 52cqw; margin-top: 1.5cqw; flex: none; }
.archwrap::before {
  content: ""; position: absolute; inset: -2cqw -2cqw 0; border: 1px solid var(--rose);
  border-radius: 999px 999px 0 0; pointer-events: none; border-bottom: 0;
}
.arch { aspect-ratio: 2 / 2.75; border-radius: 999px 999px 0 0; overflow: hidden; background: var(--beige); }
.arch img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
.c-eyebrow { font: 500 2.5cqw/1 var(--display); letter-spacing: .34em; text-transform: uppercase; margin: 5cqw 0 0; padding-left: .34em; color: var(--muted); }
.c-names { margin: 2cqw 0 0; font: 400 11cqw/1.2 var(--script); white-space: nowrap; }
.c-date { font: 500 2.9cqw/1.9 var(--display); letter-spacing: .16em; text-transform: uppercase; margin: 2.6cqw 0 0; }
.c-venue { font: 500 3.6cqw/1.3 var(--display); letter-spacing: .2em; text-transform: uppercase; margin: 1.6cqw 0 0; }
.c-reply { font: italic 500 3.5cqw/1.3 var(--text); margin: auto 0 0; color: var(--muted); }

.fl { position: absolute; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .7s ease .55s, transform 1.1s cubic-bezier(.2, .8, .25, 1) .5s; }
.fl svg { display: block; width: 100%; height: auto; overflow: visible; }
.fl.a { left: -8cqw; bottom: 50cqw; width: 50cqw; transform-origin: 0 100%; transform: scale(.45) rotate(-10deg); }
.fl.b { right: -8cqw; top: -7cqw; width: 36cqw; transform-origin: 100% 0; transform: scale(.45) rotate(10deg); }
.fl.b svg { transform: rotate(180deg); }
.fl.c { right: -1cqw; bottom: 53cqw; width: 19cqw; transform-origin: 50% 100%; transform: scale(.4); }

.open .flap { transform: rotateX(180deg); z-index: 1; }
.up .card { transform: translate(-50%, -50%) translateY(calc(var(--E) * -.56)) scale(.48); }
.out .card { transform: translate(-50%, -50%) translateY(calc(var(--E) * -.08)) scale(1); z-index: 6; transition-duration: 1s; }
.out .back, .out .pocket { opacity: 0; transform: translateY(calc(var(--E) * .35)); }
.out .flap { opacity: 0; }
.out .fl { opacity: 1; transform: none; }

.go {
  position: absolute; left: 50%; top: calc(100% + var(--E) * .24 + 24px); transform: translateX(-50%);
  width: min(290px, 82vw); text-align: center;
  font: 500 .76rem/1 var(--display); letter-spacing: .28em; text-transform: uppercase; text-decoration: none;
  padding: 19px 24px; border: 1px solid var(--espresso); background: var(--espresso); color: var(--ivory);
  opacity: 0; pointer-events: none; transition: opacity .7s ease, background .25s, color .25s; z-index: 7;
}
.done .go { opacity: 1; pointer-events: auto; }
.done .go:hover { background: transparent; color: var(--espresso); }
.go:focus-visible { outline: 2px solid var(--rose); outline-offset: 4px; }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01s !important; transition-delay: 0s !important; animation: none !important; }
}
</style>
</head>

<script>
(function () {
  var stage = document.getElementById('stage');
  var live = document.getElementById('live');
  var started = false;
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function step(cls, ms) { setTimeout(function () { stage.classList.add(cls); }, still ? 0 : ms); }
  function open() {
    if (started) return;
    started = true;
    stage.classList.add('open');
    step('up', 700);
    step('out', 1700);
    step('done', 3200);
    setTimeout(function () { live.textContent = 'Invitation opened. The RSVP and details link is below the card.'; }, still ? 0 : 3300);
  }
  document.getElementById('seal').addEventListener('click', function (e) { e.stopPropagation(); open(); });
  stage.addEventListener('click', open);
})();
