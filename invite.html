<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Madison &amp; Andrew Invitation</title>
<meta name="description" content="You are invited to celebrate the engagement of Madison Baker and Andrew Colalillo. Sunday, January 10, 2027.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Cormorant+Garamond:ital,wght@0,400..700;1,400..600&family=Pinyon+Script&display=swap">
<style>
/* Dusty-rose envelope with lace peeking from under the flap. The seal opens it, the arched card rises out
   and comes forward, a photo strip slides from behind it and baby's breath settles on before the button appears. */
:root {
  --ivory: #F5EFE6;
  --paper: #FBF8F2;
  --beige: #D8C7B2;
  --rose: #C89AA1;
  --olive: #7A8466;
  --espresso: #38251F;
  --gold: #A8864B;
  --muted: #6B5A50;
  --script: 'Pinyon Script', 'Snell Roundhand', 'Apple Chancery', cursive;
  --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', 'Times New Roman', serif;
  --text: 'Cormorant Garamond', Garamond, Georgia, serif;
  --E: min(86vw, 420px, calc((100svh - 190px) / 1.3));
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .24  0 0 0 0 .2  0.5 0 0 0 -.19'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --mottle: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='m' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='.012 .02' numOctaves='2' seed='9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .22 -.04'/></filter><rect width='100%25' height='100%25' filter='url(%23m)'/></svg>");
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--ivory);
  background-image: var(--grain), var(--mottle), radial-gradient(120% 90% at 50% 38%, #FBF7EE 0%, var(--ivory) 55%, #E9DECC 100%);
  color: var(--espresso);
  font: 500 1.25rem/1.6 var(--text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img { display: block; max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.page {
  min-height: 100svh; display: grid; place-items: center; padding-block: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.stage { position: relative; width: var(--E); height: calc(var(--E) * .6667); perspective: 1400px; }
.stage:not(.open) { cursor: pointer; }
.part { position: absolute; transition: opacity .8s ease .15s, transform .9s cubic-bezier(.45, 0, .2, 1) .1s; }
.back { inset: 0; z-index: 0; }
.pocket { inset: 0; z-index: 3; }
.part svg { display: block; width: 100%; height: 100%; overflow: visible; }
.back svg { filter: drop-shadow(0 14px 18px rgba(80, 40, 45, .3)); }

.flap {
  left: 0; top: 0; width: 100%; height: 55%;
  transform-origin: 50% 0; transform-style: preserve-3d; z-index: 5;
  transition: transform .8s cubic-bezier(.5, 0, .2, 1), z-index 0s .4s, opacity .8s ease .15s;
}
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face.rev { transform: rotateX(180deg); }
.face svg { filter: drop-shadow(0 5px 6px rgba(90, 50, 45, .22)); }

.seal {
  position: absolute; left: 50%; top: 100%; width: calc(var(--E) * .23);
  transform: translate(-50%, -50%) translateZ(2px);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 0; padding: 0; cursor: pointer; background: none; overflow: visible;
  filter: drop-shadow(0 2px 2px rgba(50, 25, 15, .4)) drop-shadow(0 7px 7px rgba(50, 25, 15, .25));
  transition: opacity .25s ease;
}
.seal img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
.seal::after {
  content: ""; position: absolute; inset: 6%; border-radius: 50%;
  border: 1px solid rgba(200, 165, 95, .85); animation: ring 2.6s ease-out infinite;
}
.seal:focus-visible { outline: 2px solid var(--rose); outline-offset: 6px; }
@keyframes ring { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.7); opacity: 0; } }
.open .seal { opacity: 0; pointer-events: none; }
.open .seal::after { animation: none; }

.hint {
  position: absolute; left: 0; right: 0; top: calc(100% + 30px); text-align: center;
  font: 500 .72rem/1.6 var(--display); letter-spacing: .32em; text-transform: uppercase; color: var(--muted);
  transition: opacity .4s ease;
}
.open .hint { opacity: 0; }

/* Card: an arched invitation, words only, with layered sheets and a photo strip behind it */
.card {
  position: absolute; left: 50%; top: 50%; width: calc(var(--E) * .78); aspect-ratio: 5 / 6.7;
  z-index: 2; container-type: inline-size;
  transform: translate(-50%, -50%) scale(.55);
  transition: transform .9s cubic-bezier(.45, 0, .2, 1);
}
.sheet { position: absolute; inset: 0; border-radius: 999px 999px 0 0; box-shadow: 0 1px 1px rgba(60,35,30,.3), 0 8px 16px -8px rgba(60, 35, 30, .4); background-image: var(--grain), var(--mottle); }
.sheet.s1 { background-color: #A9B08F; transform: rotate(-3.4deg) translate(-1.5cqw, .8cqw); }
.sheet.s2 { background-color: #D9B0B3; transform: rotate(2.8deg) translate(1.6cqw, .6cqw); }
.paper {
  position: relative; height: 100%; background: var(--paper); border-radius: 999px 999px 0 0;
  box-shadow: 0 1px 0 #fff inset, 0 1px 1px rgba(40,24,18,.25), 0 6px 12px -4px rgba(40,24,18,.22), 0 24px 40px -16px rgba(40, 24, 18, .45);
  display: flex; flex-direction: column; align-items: center; text-align: center; padding: 13.5cqw 8cqw 8cqw;
  background-image: var(--grain), var(--mottle); background-color: #FAF6EE; color: #3B2A24;
  text-shadow: 0 .05em 0 rgba(255,255,255,.8), 0 0 .5px rgba(59,42,36,.45);
}
.paper::before { content: ""; position: absolute; inset: 3cqw; border: 1px solid #CDBBA2; box-shadow: 0 1px 0 rgba(255,255,255,.9), inset 0 1px 0 rgba(120,95,70,.18); border-radius: 999px 999px 0 0; pointer-events: none; }
.c-mono { width: 11cqw; height: 8.6cqw; margin-bottom: 4.5cqw; -webkit-mask: url(img/monogram.png) center / contain no-repeat; mask: url(img/monogram.png) center / contain no-repeat; background: linear-gradient(115deg, #8F6D2E 0%, #E6CD8B 30%, #A98544 52%, #DDBF78 76%, #8C6A2B 100%); filter: drop-shadow(0 .4px 0 rgba(255,255,255,.8)); }
.c-eyebrow { font: 500 2.6cqw/1 var(--display); letter-spacing: .34em; text-transform: uppercase; margin: 0; padding-left: .34em; color: var(--muted); }
.c-names { margin: 4cqw 0 0; font: 400 15.5cqw/.98 var(--script); display: flex; flex-direction: column; align-items: center; }
.c-names i { font-style: normal; font-size: 8.5cqw; line-height: 1.15; }
.rule { width: 14cqw; height: 1px; background: var(--gold); margin: 5cqw 0 4.5cqw; opacity: .7; }
.c-date { font: 500 3cqw/1.9 var(--display); letter-spacing: .16em; padding-left: .16em; text-transform: uppercase; margin: 0; }
.c-venue { font: 500 3.4cqw/1.3 var(--display); letter-spacing: .16em; padding-left: .16em; text-transform: uppercase; margin: 3cqw 0 0; }
.c-reply { font: italic 500 3.6cqw/1.3 var(--text); margin: 3.2cqw 0 0; color: var(--muted); }

/* Photo strip: a printed booth strip with a piece of tape */
.strip {
  --S: calc(var(--E) * .23);
  position: absolute; left: 50%; top: 50%; width: var(--S); z-index: 2;
  padding: calc(var(--S) * .178) calc(var(--S) * .089) calc(var(--S) * .25);
  background-color: #F8F4EB; background-image: var(--grain), var(--mottle);
  box-shadow: 0 1px 1px rgba(50,30,25,.3), 0 4px 8px -2px rgba(50,30,25,.25), 0 16px 26px -10px rgba(50, 30, 25, .5);
  transform: translate(-50%, -50%) translate(calc(var(--E) * .355), 0) rotate(2deg); opacity: 0;
  transition: transform 1.2s cubic-bezier(.2, .8, .25, 1), opacity .5s ease;
}
.ph { position: relative; display: block; margin-bottom: calc(var(--S) * .067); background: var(--beige); overflow: hidden; box-shadow: inset 0 0 0 .3px rgba(0,0,0,.4); }
.ph:nth-of-type(3) { margin-bottom: 0; }
.ph img { width: 100%; aspect-ratio: 1 / 1.12; object-fit: cover; filter: saturate(.88) contrast(.95) sepia(.14) brightness(1.02); }
.ph::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--grain), radial-gradient(120% 120% at 50% 40%, transparent 55%, rgba(40,25,15,.28) 100%), linear-gradient(155deg, rgba(255,255,255,.22) 0%, transparent 38%); box-shadow: inset 0 0 5px rgba(0,0,0,.35); }
.strip p { position: absolute; left: 0; right: 0; bottom: calc(var(--S) * .083); margin: 0; text-align: center; font: 500 calc(var(--S) * .053)/1 var(--display); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); padding-left: .3em; }
.pin { position: absolute; left: 50%; top: calc(var(--S) * .044); width: calc(var(--S) * .18); aspect-ratio: 1; margin-left: calc(var(--S) * -.09); border-radius: 50%; z-index: 3;
  background: radial-gradient(circle at 34% 30%, #FBEFC6 0%, #E3C98A 30%, #C29E56 62%, #9C7A36 100%);
  box-shadow: 0 3px 4px -1px rgba(40,25,15,.5), 0 1px 2px rgba(40,25,15,.35), inset 0 0 0 1px rgba(255,244,205,.55), inset 0 -2px 3px rgba(105,75,25,.5); }
.pin::after { content: ""; position: absolute; left: 20%; top: 14%; width: 34%; height: 24%; border-radius: 50%; background: rgba(255,255,255,.7); filter: blur(.5px); transform: rotate(-30deg); }
.fl { position: absolute; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .7s ease .6s, transform 1.2s cubic-bezier(.2, .8, .25, 1) .55s; }
.fl svg { display: block; width: 100%; height: auto; overflow: visible; }
.fl.a { left: calc(var(--E) * .05); bottom: calc(var(--E) * .33); width: calc(var(--E) * .42); z-index: 2; transform-origin: 0 100%; transform: scale(.5) rotate(-8deg); }
.fl.b { right: calc(var(--E) * .05); bottom: calc(var(--E) * .33); width: calc(var(--E) * .38); z-index: 2; transform-origin: 100% 100%; transform: scale(.5) rotate(8deg); }
.fl.b svg { transform: scaleX(-1); }

.open .flap { transform: rotateX(180deg); z-index: 1; }
.up .card { transform: translate(-50%, -50%) translate(0, calc(var(--E) * -.40)) scale(.97); transition-duration: 1.5s; }
.out .strip { opacity: 1; transform: translate(-50%, -50%) translate(calc(var(--E) * .355), calc(var(--E) * -.36)) rotate(4deg); }
.out .fl { opacity: 1; transform: none; }

.go {
  position: absolute; left: 50%; top: calc(100% + 34px); transform: translateX(-50%);
  width: min(290px, 82vw); text-align: center;
  font: 500 .76rem/1 var(--display); letter-spacing: .28em; text-transform: uppercase; text-decoration: none;
  padding: 19px 24px; border: 1px solid var(--espresso); background: var(--espresso); color: var(--ivory);
  opacity: 0; pointer-events: none; transition: opacity .7s ease, background .25s, color .25s; z-index: 7;
}
.done .go { opacity: 1; pointer-events: auto; }
.done .go:hover { background: transparent; color: var(--espresso); }
.go:focus-visible { outline: 2px solid var(--rose); outline-offset: 4px; }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01s !important; transition-delay: 0s !important; animation: none !important; }
}
</style>
</head>

<script>
(function () {
  var stage = document.getElementById('stage');
  var live = document.getElementById('live');
  var started = false;
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function step(cls, ms) { setTimeout(function () { stage.classList.add(cls); }, still ? 0 : ms); }
  function open() {
    if (started) return;
    started = true;
    stage.classList.add('open');
    step('up', 700);
    step('out', 2300);
    step('done', 3700);
    setTimeout(function () { live.textContent = 'Invitation opened. The RSVP and details link is below the card.'; }, still ? 0 : 3800);
  }
  document.getElementById('seal').addEventListener('click', function (e) { e.stopPropagation(); open(); });
  stage.addEventListener('click', open);
})();
</script>
